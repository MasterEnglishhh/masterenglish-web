name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Get source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Test auth and Pages API proxy
        run: npm test
      - name: Build static frontend for Cloudflare Pages
        run: npm run build:pages
