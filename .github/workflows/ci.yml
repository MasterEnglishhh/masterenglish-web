name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Get source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend Docker image
        run: docker build --build-arg BACKEND_URL=http://api:8080 --tag masterenglish-web:ci .

      - name: Smoke test frontend container
        run: |
          docker run --detach --name masterenglish-web-ci \
            --publish 127.0.0.1:3000:3000 masterenglish-web:ci
          trap 'docker logs masterenglish-web-ci; docker rm --force masterenglish-web-ci >/dev/null' EXIT
          curl --fail --silent --show-error \
            --retry 15 --retry-connrefused --retry-delay 2 --retry-max-time 45 \
            --max-time 5 --output /dev/null http://127.0.0.1:3000/
